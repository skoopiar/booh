<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kaizo Knight</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;outline:none}#status{display:none}</style></head><body><canvas id="canvas" width="640" height="480" tabindex="0" aria-label="Kaizo Knight battle"></canvas><p id="status" role="status"></p><script>
(function(){
 function report(message){try{parent.postMessage({type:'KNIGHT_DEBUG_LOG',level:'INFO',message:'[IFRAME BOOT] '+message},'*')}catch(e){}}
 window.addEventListener('error',function(e){report('window error: '+(e.message||'unknown')+' ('+(e.filename||'')+':'+(e.lineno||0)+')')});
 window.addEventListener('unhandledrejection',function(e){report('unhandled rejection: '+String(e.reason||'unknown'))});
 report('inline bootstrap executed; location='+location.href);
})();
</script>

<script src="runner.js?v=fsdiag-04" onload="parent.postMessage({type:'KNIGHT_DEBUG_LOG',level:'INFO',message:'[IFRAME BOOT] runner.js loaded'},'*')" onerror="parent.postMessage({type:'KNIGHT_DEBUG_LOG',level:'ERROR',message:'[IFRAME BOOT] runner.js FAILED to load'},'*')"></script></body></html>

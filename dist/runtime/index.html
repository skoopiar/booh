<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kaizo Knight</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;outline:none}#status{display:none}</style></head><body><canvas id="canvas" width="640" height="480" tabindex="0" aria-label="Kaizo Knight battle"></canvas><p id="status" role="status"></p><script>
(function(){
 function report(message){try{parent.postMessage({type:'KNIGHT_DEBUG_LOG',level:'INFO',message:'[IFRAME BOOT] '+message},'*')}catch(e){}}
 window.addEventListener('error',function(e){report('window error: '+(e.message||'unknown')+' ('+(e.filename||'')+':'+(e.lineno||0)+')')});
 window.addEventListener('unhandledrejection',function(e){report('unhandled rejection: '+String(e.reason||'unknown'))});
 report('inline bootstrap executed; location='+location.href);
})();
</script>
<script src="bridge.js?v=webgl-trace-01" onload="parent.postMessage({type:'KNIGHT_DEBUG_LOG',level:'INFO',message:'[IFRAME BOOT] bridge.js loaded'},'*')" onerror="parent.postMessage({type:'KNIGHT_DEBUG_LOG',level:'ERROR',message:'[IFRAME BOOT] bridge.js FAILED to load'},'*')"></script>
<script src="runner.js?v=fsdiag-04" onload="parent.postMessage({type:'KNIGHT_DEBUG_LOG',level:'INFO',message:'[IFRAME BOOT] runner.js loaded'},'*')" onerror="parent.postMessage({type:'KNIGHT_DEBUG_LOG',level:'ERROR',message:'[IFRAME BOOT] runner.js FAILED to load'},'*')"></script>
<script>
(function patchDiscordGameLoad(){
  function install(){
    var orig = window.__gx_async_wget2;
    if (typeof orig !== 'function') {
      console.warn('[KNIGHT] __gx_async_wget2 not found; cannot patch');
      return;
    }
    if (orig.__knightPatched) return;
    window.__gx_async_wget2 = function(a,b,c,d,e,f,g){
      console.log('[STARTUP TRACE] async_wget2 (discord-patched) for', a);
      var buf = window.__knightGameBuffer;
      var p = window.parent;
      if (buf && p && typeof p.fetch === 'function') {
        var realFetch = p.fetch.bind(p);
        var gameUrl = null;
        try { gameUrl = p.knightHost && p.knightHost.getGameURL && p.knightHost.getGameURL(); } catch (_) {}
        p.fetch = function(input, init){
          var url = typeof input === 'string' ? input : (input && input.url);
          if (url && (url === gameUrl || String(url).indexOf('blob:') === 0)) {
            console.log('[KNIGHT] parent.fetch intercepted — serving cached buffer, bytes=' + buf.byteLength);
            return Promise.resolve(new Response(buf.slice(0), {status:200, statusText:'OK'}));
          }
          return realFetch(input, init);
        };
      } else {
        console.warn('[KNIGHT] no cached buffer yet when async_wget2 ran; buf=', !!buf);
      }
      return orig.apply(this, arguments);
    };
    window.__gx_async_wget2.__knightPatched = true;
    console.log('[KNIGHT] __gx_async_wget2 patched for Discord blob fallback');
  }
  install();
})();
</script>
